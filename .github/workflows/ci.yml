# push·PR마다 테스트와 검사를 자동으로 돌린다. 실패하면 GitHub에 빨간 X가 뜬다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새로 push하면 이전 실행은 취소한다 (Actions 무료 시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Testcontainers가 GitHub 러너의 Docker로 PostgreSQL을 띄운다. 비밀 값은 필요 없다
      - run: ./gradlew test --console=plain
      - name: 실패하면 테스트 결과 보관
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: 프론트 검사·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # PageProps 같은 라우트 타입은 next dev·build가 만들어 둔다. 깨끗한 컴퓨터에는 없으므로 먼저 만든다
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      # 백엔드 없이 빌드된다 (데이터는 요청 때 받아 옴)
      - run: npm run build

  # 백엔드(Gradle) 라이브러리 목록을 GitHub에 알려 준다. GitHub는 Gradle 설정을 직접 읽지 못해서,
  # 이게 없으면 백엔드 라이브러리 보안 문제는 Dependabot 알림이 오지 않는다. (2026-11-18 확인: npm만 보였음)
  backend-dependencies:
    name: 백엔드 라이브러리 목록 제출
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # 의존성 그래프 제출에 필요 (코드는 바꾸지 않음)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: backend
