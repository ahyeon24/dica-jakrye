spring:
  application:
    name: dica-jakrye
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 20MB      # 작례 원본 최대 크기 (SECURITY.md 5장)
      max-request-size: 21MB
  config:
    # 로컬 비밀 값(backend/.env, Git에 안 올라감). 운영은 서버 환경변수로 넣으므로 이 파일이 없다.
    import: optional:file:.env[.properties]
  mail:
    # 신고 알림 메일 (Gmail SMTP + 앱 비밀번호). 사용자 이름이 비어 있으면 메일 대신 로그만 남긴다
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-set}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-set}
            scope: openid  # 회원번호(sub)만 받는다. 이메일·프로필은 요청하지 않음 (SECURITY.md 13장)
          kakao:
            client-id: ${KAKAO_CLIENT_ID:not-set}
            client-secret: ${KAKAO_CLIENT_SECRET:not-set}
            client-name: Kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # scope 없음: 동의항목을 켜지 않고 회원번호(id)만 받는다
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # 테이블은 Flyway 마이그레이션으로만 만든다. JPA가 테이블을 바꾸지 않게 한다.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  tomcat:
    max-swallow-size: 50MB   # 20MB를 조금 넘는 요청도 연결을 끊지 않고 413으로 답하게
  servlet:
    session:
      timeout: 30d       # 마지막 요청 후 30일 (API.md 1.2). 세션은 DB(spring_session)에 저장
      cookie:
        http-only: true
        same-site: lax
        secure: false    # 운영(prod)에서 true
  error:
    include-stacktrace: never  # 에러 응답에 내부 정보를 내보내지 않는다 (SECURITY.md 11장)
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  front-url: ${FRONT_URL:http://localhost:3000}   # 로그인 후 돌아갈 프론트 주소
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  terms:
    # 현재 시행 중인 약관 버전 (ERD.md 3.10). 약관 페이지를 만들 때 실제 시행일로 바꾼다
    terms-of-service: "2026-11-01"
    privacy-collection: "2026-11-01"
  notify:
    admin-email: ${ADMIN_NOTIFY_EMAIL:dicajakrye@gmail.com}   # 신고 알림을 받을 운영 메일
  upload:
    max-per-hour: 30     # 한 사람이 1시간에 올릴 수 있는 장수 (운영하며 조정)
    max-concurrent: 2    # 이 서버에서 동시에 처리할 업로드 수 (2GB 서버 기준)
  image:
    # 공개 이미지 주소 앞부분. 운영은 https://img.{도메인} (R2 공개 버킷)
    base-url: ${IMAGE_BASE_URL:http://localhost:8080/dev-images}
  storage:
    type: local          # local | r2 (r2는 배포 전에 추가)
    local:
      dir: ./data/images # 로컬 개발용. Git에 올리지 않음
  commons:
    api-url: https://commons.wikimedia.org/w/api.php
    # 위키미디어 규칙: 서비스 이름/버전 (연락처) 라이브러리. 연락처는 운영용 메일 (개인 메일 X). 도메인이 생기면 서비스 주소 추가
    user-agent: ${COMMONS_USER_AGENT:dica-jakrye/0.1 (dicajakrye@gmail.com) java-http-client/21}
    request-delay: 2s
    download-delay: 3s   # 처음 만드는 축소본은 서버 부담이 커서 1초 간격이면 429로 막힘 (2026-11-17 확인)
    pool-size: 500
    per-camera: 100
    per-author: 10
    min-long-side: 400
    cameras-per-run: 50
  batch:
    run-on-startup: ""   # 예: commons-collect
    commons-collect:
      cron: "-"          # 운영: "0 0 4 * * *" (매일 새벽 4시). "-"이면 끔
      only-slugs: ""     # 예: canon-ixus-30,sony-dsc-t1 (테스트용)

---
# 로컬 개발: docker compose 의 PostgreSQL (5433)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/dica
    username: dica
    password: dica-local
  jpa:
    show-sql: false

---
# 운영: 접속 정보는 환경변수로만 받는다. (값을 이 파일에 쓰지 않는다)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          # 운영은 기본값 없이 받는다. 빠지면 서버가 뜨지 않게 해서 바로 알 수 있게 한다
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}

server:
  servlet:
    session:
      cookie:
        secure: true
        domain: ${COOKIE_DOMAIN}   # 예: .{도메인} (프론트와 api.{도메인}이 쿠키를 같이 씀)

app:
  front-url: ${FRONT_URL}
  cookie-domain: ${COOKIE_DOMAIN}   # XSRF-TOKEN 쿠키도 같은 도메인으로
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
